<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda dos Líderes</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .conteudo-estreito {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 20px;
    }
    #lista-lideres {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .botao-lider {
      padding: 18px;
      font-size: 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .botao-lider:active {
      background-color: #1d4ed8;
    }
    #tela-semana, #tela-foco {
      display: none;
    }
    .botao-voltar {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      padding: 0;
    }
    #lista-semana {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .card-dia {
      background: white;
      border-radius: 10px;
      padding: 14px;
      min-width: 0;
    }
    .card-dia h3 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 15px;
    }
    .card-dia.dia-hoje {
      border: 2px solid #2563eb;
    }
    .card-dia.dia-bloqueado {
      opacity: 0.6;
    }
    .nota-bloqueado {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .lista-rotina {
      margin: 0 0 10px 0;
      padding-left: 18px;
      color: #555;
      font-size: 13px;
    }
    .linha-rotina-check {
      display: flex;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
    .linha-rotina-check input {
      width: 22px;
      height: 22px;
      margin-right: 10px;
      accent-color: #2563eb;
    }
    .linha-rotina-check span {
      font-weight: bold;
      font-size: 13px;
    }
    .linha-foco {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fef3c7;
      border: none;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      color: #92400e;
      cursor: pointer;
      text-align: left;
    }
    .linha-foco:disabled {
      background-color: #eee;
      color: #999;
      cursor: not-allowed;
    }
    .status-foco {
      font-size: 11px;
      font-weight: normal;
    }
    .item-checklist {
      display: flex;
      align-items: flex-start;
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .item-checklist input[type="checkbox"] {
      width: 24px;
      height: 24px;
      min-width: 24px;
      flex-shrink: 0;
      margin: 2px 14px 0 0;
      accent-color: #2563eb;
    }
    .item-checklist .textos {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .item-checklist .titulo {
      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1.3;
      font-weight: bold;
      margin: 0;
    }
    .item-checklist .descricao {
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.3;
      color: #666;
      margin: 0;
    }
    .item-checklist.concluido .titulo {
      text-decoration: line-through;
      color: #999;
    }
    .plano-acao {
      font-family: Arial, sans-serif;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      resize: vertical;
      width: 100%;
      margin-top: 2px;
    }
    .plano-acao-label {
      font-size: 12px;
      color: #888;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- TELA 1: SELECIONAR LÍDER -->
  <div id="tela-selecao" class="conteudo-estreito">
    <h1>Quem é você?</h1>
    <div id="lista-lideres">Carregando líderes...</div>
  </div>

  <!-- TELA 2: AGENDA DA SEMANA -->
  <div id="tela-semana">
    <button class="botao-voltar" onclick="voltarParaSelecao()">&larr; Trocar líder</button>
    <h1 id="nome-lider-semana"></h1>
    <p class="subtitulo">Expediente: 07:30 às 17:18</p>
    <div id="lista-semana">Carregando agenda...</div>
  </div>

  <!-- TELA 3: CHECKLIST DE FOCO (5S / Qualidade / Segurança) -->
  <div id="tela-foco" class="conteudo-estreito">
    <button class="botao-voltar" onclick="voltarParaSemana()">&larr; Voltar para a semana</button>
    <h1 id="titulo-foco"></h1>
    <div id="lista-foco">Carregando checklist...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rcliveeoksfafxytckii.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LjQkaNYOQE2kxBxaTs88dg_rZpOdEI_";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let liderAtual = null;
    let focoAtual = null; // { tipo, label, data }

    const ORDEM_DIAS = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
    const NOMES_DIAS = {
      segunda: 'Segunda-feira',
      terca: 'Terça-feira',
      quarta: 'Quarta-feira',
      quinta: 'Quinta-feira',
      sexta: 'Sexta-feira'
    };
    const FOCOS_POR_DIA = {
      segunda: { tipo: '5s', label: '🧹 5S - Auto avaliação' },
      quarta: { tipo: 'qualidade', label: '✅ Qualidade - Auto avaliação' },
      sexta: { tipo: 'seguranca', label: '🦺 Segurança - Auto avaliação' }
    };

    function formatarISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function hojeISO() {
      return formatarISO(new Date());
    }

    function diaSemanaAtual() {
      const dias = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
      return dias[new Date().getDay()];
    }

    function obterDatasDaSemana() {
      const hoje = new Date();
      const diaSemanaNum = hoje.getDay();
      const offsetSegunda = diaSemanaNum === 0 ? -6 : 1 - diaSemanaNum;
      const segunda = new Date(hoje);
      segunda.setDate(hoje.getDate() + offsetSegunda);

      const resultado = {};
      ORDEM_DIAS.forEach((dia, index) => {
        const d = new Date(segunda);
        d.setDate(segunda.getDate() + index);
        resultado[dia] = formatarISO(d);
      });
      return resultado;
    }

    async function carregarLideres() {
      const { data, error } = await supabaseClient.from('lideres').select('*').order('nome');

      const lista = document.getElementById('lista-lideres');
      lista.innerHTML = '';

      if (error) {
        lista.innerHTML = 'Erro ao carregar: ' + error.message;
        return;
      }

      data.forEach(lider => {
        const botao = document.createElement('button');
        botao.className = 'botao-lider';
        botao.textContent = lider.nome;
        botao.onclick = () => selecionarLider(lider);
        lista.appendChild(botao);
      });
    }

    function selecionarLider(lider) {
      liderAtual = lider;
      document.getElementById('tela-selecao').style.display = 'none';
      document.getElementById('tela-semana').style.display = 'block';
      document.getElementById('nome-lider-semana').textContent = 'Agenda de ' + lider.nome;
      carregarSemana();
    }

    function voltarParaSelecao() {
      liderAtual = null;
      document.getElementById('tela-semana').style.display = 'none';
      document.getElementById('tela-selecao').style.display = 'block';
    }

    function voltarParaSemana() {
      focoAtual = null;
      document.getElementById('tela-foco').style.display = 'none';
      document.getElementById('tela-semana').style.display = 'block';
      carregarSemana();
    }

    async function carregarSemana() {
      const container = document.getElementById('lista-semana');
      container.innerHTML = 'Carregando agenda...';

      const datas = obterDatasDaSemana();
      const todasAsDatas = Object.values(datas);

      const { data: todosOsItens, error: erroItens } = await supabaseClient
        .from('itens_agenda')
        .select('*')
        .or('lider_id.eq.' + liderAtual.id + ',lider_id.is.null');

      if (erroItens) {
        container.innerHTML = 'Erro ao carregar itens: ' + erroItens.message;
        return;
      }

      const { data: execucoesSemana, error: erroExec } = await supabaseClient
        .from('execucoes')
        .select('*')
        .eq('lider_id', liderAtual.id)
        .in('data', todasAsDatas);

      if (erroExec) {
        container.innerHTML = 'Erro ao carregar execuções: ' + erroExec.message;
        return;
      }

      container.innerHTML = '';
      const diaHoje = diaSemanaAtual();

      ORDEM_DIAS.forEach(dia => {
        const dataDoDia = datas[dia];
        const estaDisponivel = (dia === diaHoje);

        const itensNormais = todosOsItens
          .filter(item =>
            (item.dia_semana === 'todos' || item.dia_semana === dia) &&
            (!item.categoria || item.categoria === '')
          )
          .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
        const card = document.createElement('div');
        card.className = 'card-dia' + (estaDisponivel ? ' dia-hoje' : ' dia-bloqueado');

        const titulo = document.createElement('h3');
        titulo.textContent = NOMES_DIAS[dia];
        card.appendChild(titulo);

        if (itensNormais.length > 0) {
          const ul = document.createElement('ul');
          ul.className = 'lista-rotina';
          itensNormais.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.titulo;
            ul.appendChild(li);
          });
          card.appendChild(ul);

          const execRotina = execucoesSemana.find(e => e.item_id === null && e.data === dataDoDia);
          const rotinaConcluida = execRotina ? execRotina.concluido : false;

          const linhaCheck = document.createElement('div');
          linhaCheck.className = 'linha-rotina-check';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = rotinaConcluida;
          checkbox.disabled = !estaDisponivel;
          checkbox.onchange = () => marcarRotinaDia(dataDoDia, execRotina, checkbox.checked);

          const label = document.createElement('span');
          label.textContent = 'Rotina do dia cumprida';

          linhaCheck.appendChild(checkbox);
          linhaCheck.appendChild(label);
          card.appendChild(linhaCheck);

          if (!estaDisponivel) {
            const nota = document.createElement('p');
            nota.className = 'nota-bloqueado';
            nota.textContent = 'Disponível somente no dia correspondente.';
            card.appendChild(nota);
          }
        } else {
          const p = document.createElement('p');
          p.className = 'lista-rotina';
          p.textContent = 'Nenhum item de rotina cadastrado.';
          card.appendChild(p);
        }

        const foco = FOCOS_POR_DIA[dia];
        if (foco) {
          const itensFoco = todosOsItens.filter(item => item.categoria === foco.tipo);
          const execucoesFoco = execucoesSemana.filter(e =>
            e.data === dataDoDia && itensFoco.some(i => i.id === e.item_id)
          );
          const focoConcluido = itensFoco.length > 0 &&
            itensFoco.every(item => execucoesFoco.some(e => e.item_id === item.id && e.concluido));

          const botaoFoco = document.createElement('button');
          botaoFoco.className = 'linha-foco';
          botaoFoco.disabled = !estaDisponivel;
          botaoFoco.innerHTML = '<span>' + foco.label + '</span>' +
            '<span class="status-foco">' + (focoConcluido ? '✔️ Concluído' : 'Pendente') + '</span>';
          if (estaDisponivel) {
            botaoFoco.onclick = () => abrirFoco(foco.tipo, foco.label, dataDoDia);
          }
          card.appendChild(botaoFoco);
        }

        container.appendChild(card);
      });
    }

    async function marcarRotinaDia(data, execExistente, concluido) {
      const agora = new Date().toISOString();

      if (execExistente) {
        const { error } = await supabaseClient
          .from('execucoes')
          .update({ concluido: concluido, hora_conclusao: concluido ? agora : null })
          .eq('id', execExistente.id);

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      } else {
        const { error } = await supabaseClient
          .from('execucoes')
          .insert({
            item_id: null,
            lider_id: liderAtual.id,
            data: data,
            concluido: concluido,
            hora_conclusao: concluido ? agora : null
          });

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      }

      carregarSemana();
    }

    function abrirFoco(tipo, label, data) {
      focoAtual = { tipo: tipo, label: label, data: data };
      document.getElementById('tela-semana').style.display = 'none';
      document.getElementById('tela-foco').style.display = 'block';
      document.getElementById('titulo-foco').textContent = label;
      carregarFoco();
    }

    async function carregarFoco() {
      const container = document.getElementById('lista-foco');
      container.innerHTML = 'Carregando checklist...';

      const { data: itens, error: erroItens } = await supabaseClient
        .from('itens_agenda')
        .select('*')
        .eq('categoria', focoAtual.tipo)
        .order('ordem', { ascending: true });

      if (erroItens) {
        container.innerHTML = 'Erro ao carregar itens: ' + erroItens.message;
        return;
      }

      const { data: execucoesFoco, error: erroExec } = await supabaseClient
        .from('execucoes')
        .select('*')
        .eq('lider_id', liderAtual.id)
        .eq('data', focoAtual.data);

      if (erroExec) {
        container.innerHTML = 'Erro ao carregar execuções: ' + erroExec.message;
        return;
      }

      container.innerHTML = '';

      if (itens.length === 0) {
        container.innerHTML = 'Nenhum item cadastrado para este checklist ainda.';
        return;
      }

      itens.forEach(item => {
        const execExistente = execucoesFoco.find(e => e.item_id === item.id);
        const jaConcluido = execExistente ? execExistente.concluido : false;
        const planoExistente = execExistente && execExistente.observacao ? execExistente.observacao : '';

        const div = document.createElement('div');
        div.className = 'item-checklist' + (jaConcluido ? ' concluido' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = jaConcluido;

        const textos = document.createElement('div');
        textos.className = 'textos';

        const spanTitulo = document.createElement('span');
        spanTitulo.className = 'titulo';
        spanTitulo.textContent = item.titulo;
        textos.appendChild(spanTitulo);

        if (item.descricao) {
          const spanDescricao = document.createElement('span');
          spanDescricao.className = 'descricao';
          spanDescricao.textContent = item.descricao;
          textos.appendChild(spanDescricao);
        }

        const labelPlano = document.createElement('p');
        labelPlano.className = 'plano-acao-label';
        labelPlano.textContent = 'Plano de ação (se necessário):';
        textos.appendChild(labelPlano);

        const textareaPlano = document.createElement('textarea');
        textareaPlano.className = 'plano-acao';
        textareaPlano.rows = 2;
        textareaPlano.placeholder = 'Descreva a ação, se houver algo a corrigir...';
        textareaPlano.value = planoExistente;
        textos.appendChild(textareaPlano);

        checkbox.onchange = () => salvarItemFoco(item, execExistente, checkbox, textareaPlano, div);
        textareaPlano.onblur = () => salvarItemFoco(item, execExistente, checkbox, textareaPlano, div);

        div.appendChild(checkbox);
        div.appendChild(textos);
        container.appendChild(div);
      });
    }

    async function salvarItemFoco(item, execExistente, checkbox, textareaPlano, divElemento) {
      const concluido = checkbox.checked;
      const planoAcao = textareaPlano.value.trim() === '' ? null : textareaPlano.value.trim();
      const agora = new Date().toISOString();

      if (execExistente) {
        const { error } = await supabaseClient
          .from('execucoes')
          .update({
            concluido: concluido,
            hora_conclusao: concluido ? agora : null,
            observacao: planoAcao
          })
          .eq('id', execExistente.id);

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      } else {
        const { error } = await supabaseClient
          .from('execucoes')
          .insert({
            item_id: item.id,
            lider_id: liderAtual.id,
            data: focoAtual.data,
            concluido: concluido,
            hora_conclusao: concluido ? agora : null,
            observacao: planoAcao
          });

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      }

      divElemento.classList.toggle('concluido', concluido);
      carregarFoco();
    }

    carregarLideres();
  </script>
</body>
</html>
