<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda dos Líderes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #284972;
      --azul-escuro: #1c3552;
      --laranja: #EE8024;
      --laranja-claro: #fdf0e4;
      --cinza-fundo: #F4F9FF;
      --texto-secundario: #6b7a8d;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Lato', Arial, sans-serif;
      max-width: 1300px;
      margin: 0 auto;
      padding: 30px 24px;
      background-color: var(--cinza-fundo);
      color: #22303f;
    }
    .conteudo-estreito {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--azul);
      font-weight: 900;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    .subtitulo {
      text-align: center;
      color: var(--texto-secundario);
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 30px;
    }
    #lista-lideres {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .botao-lider {
      padding: 20px;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      background-color: var(--azul);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .botao-lider:active,
    .botao-lider:hover {
      background-color: var(--azul-escuro);
    }
    #tela-semana, #tela-foco, #tela-indicadores {
      display: none;
    }
    .botao-voltar {
      background: none;
      border: none;
      color: var(--laranja);
      font-family: 'Lato', Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      cursor: pointer;
      padding: 0;
    }
    .barra-topo-semana {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto 6px auto;
    }
    .link-indicadores {
      background: none;
      border: none;
      color: var(--azul);
      font-family: 'Lato', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 14px;
      border: 2px solid var(--azul);
      border-radius: 8px;
    }
    .link-indicadores:hover {
      background-color: var(--azul);
      color: white;
    }
    #lista-semana {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 22px;
    }
    .card-dia {
      background: white;
      border-radius: 16px;
      padding: 0 0 20px 0;
      min-width: 0;
      box-shadow: 0 2px 10px rgba(40, 73, 114, 0.08);
      overflow: hidden;
    }
    .faixa-madeira {
      height: 10px;
      width: 100%;
      background: repeating-linear-gradient(
        100deg,
        #b8874f 0px,
        #a97540 3px,
        #c99a63 6px,
        #ad7c46 9px,
        #bd8b54 12px
      );
      opacity: 0.85;
    }
    .card-dia .conteudo-card {
      padding: 18px 18px 0 18px;
    }
    .card-dia h3 {
      margin: 0 0 14px 0;
      color: var(--azul);
      font-size: 16px;
      font-weight: 700;
      border-bottom: 2px solid var(--cinza-fundo);
      padding-bottom: 10px;
    }
    .card-dia.dia-hoje {
      box-shadow: 0 0 0 2px var(--laranja), 0 4px 14px rgba(238, 128, 36, 0.15);
    }
    .card-dia.dia-bloqueado {
      opacity: 0.55;
    }
    .nota-bloqueado {
      font-size: 12px;
      color: var(--texto-secundario);
      margin-top: 8px;
      font-style: italic;
    }
    .lista-rotina {
      margin: 0 0 16px 0;
      padding-left: 18px;
      color: #4b5a6c;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .lista-rotina li {
      margin-bottom: 8px;
    }
    .titulo-item-rotina {
      cursor: pointer;
      border-bottom: 1px dotted var(--texto-secundario);
    }
    .caixa-observacao {
      margin-top: 6px;
      margin-bottom: 4px;
      padding: 10px;
      background-color: var(--laranja-claro);
      border-left: 3px solid var(--laranja);
      border-radius: 6px;
      font-size: 12.5px;
      color: #6b4a1f;
      line-height: 1.4;
    }
    .linha-rotina-check {
      display: flex;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
    }
    .linha-rotina-check input {
      width: 22px;
      height: 22px;
      margin-right: 10px;
      accent-color: var(--azul);
    }
    .linha-rotina-check span {
      font-weight: 700;
      font-size: 13px;
      color: var(--azul);
    }
    .linha-foco {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--laranja-claro);
      border: none;
      border-radius: 10px;
      padding: 12px;
      margin-top: 16px;
      width: 100%;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--laranja);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s ease;
    }
    .linha-foco:hover:not(:disabled) {
      background-color: #fbe2c8;
    }
    .linha-foco:disabled {
      background-color: #f1f1f1;
      color: #aaa;
      cursor: not-allowed;
    }
    .status-foco {
      font-size: 11px;
      font-weight: 400;
    }
    .item-checklist {
      display: flex;
      align-items: flex-start;
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40, 73, 114, 0.08);
    }
    .item-checklist .textos {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .item-checklist .titulo {
      font-family: 'Lato', Arial, sans-serif;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--azul);
      margin: 0;
    }
    .item-checklist .descricao {
      font-family: 'Lato', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      color: var(--texto-secundario);
      margin: 0;
    }
    .notas-container {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .botao-nota {
      flex: 1;
      min-width: 58px;
      padding: 10px 4px;
      border-radius: 8px;
      border: 2px solid #dbe3ec;
      background: white;
      cursor: pointer;
      text-align: center;
      font-family: 'Lato', Arial, sans-serif;
    }
    .botao-nota .numero {
      font-weight: 900;
      font-size: 17px;
      display: block;
      color: var(--azul);
    }
    .botao-nota .rotulo {
      font-size: 10px;
      color: var(--texto-secundario);
    }
    .botao-nota.selecionada {
      border-color: var(--azul);
      background-color: #eaf0fa;
    }
    .aviso-obrigatorio {
      color: #c0392b;
      font-size: 12px;
      margin: 2px 0 0 0;
      display: none;
    }
    .aviso-obrigatorio.visivel {
      display: block;
    }
    .plano-acao {
      font-family: 'Lato', Arial, sans-serif;
      font-size: 13.5px;
      padding: 10px;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
      resize: vertical;
      width: 100%;
      margin-top: 4px;
      background-color: #fafcff;
    }
    .plano-acao:focus {
      outline: none;
      border-color: var(--azul);
    }
    .plano-acao-label {
      font-size: 12px;
      color: var(--texto-secundario);
      margin: 4px 0 0 0;
    }
    .observacoes-gerais {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-top: 6px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40, 73, 114, 0.08);
    }
    .observacoes-gerais h4 {
      margin: 0 0 8px 0;
      color: var(--azul);
      font-size: 15px;
    }
    .botao-salvar-foco {
      width: 100%;
      padding: 18px;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      background-color: var(--azul);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 40px;
    }
    .botao-salvar-foco:hover {
      background-color: var(--azul-escuro);
    }
    .cartoes-resumo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .cartao-resumo {
      background: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(40, 73, 114, 0.08);
    }
    .cartao-resumo .numero-grande {
      font-size: 34px;
      font-weight: 900;
      color: var(--azul);
    }
    .cartao-resumo .rotulo-cartao {
      font-size: 13px;
      color: var(--texto-secundario);
      margin-top: 4px;
    }
    .badges-foco {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .badge-foco {
      background-color: var(--laranja-claro);
      color: var(--laranja);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .secao-acompanhamento {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40, 73, 114, 0.08);
    }
    .secao-acompanhamento h3 {
      color: var(--azul);
      font-size: 16px;
      margin: 0 0 14px 0;
    }
    .linha-item-acompanhado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eef2f7;
      font-size: 13.5px;
    }
    .linha-item-acompanhado:last-child {
      border-bottom: none;
    }
    .media-nota {
      font-weight: 700;
      color: var(--azul);
      background-color: var(--cinza-fundo);
      padding: 3px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- TELA 1: SELECIONAR LÍDER -->
  <div id="tela-selecao" class="conteudo-estreito">
    <h1>Quem é você?</h1>
    <div id="lista-lideres">Carregando líderes...</div>
  </div>

  <!-- TELA 2: AGENDA DA SEMANA -->
  <div id="tela-semana">
    <div class="barra-topo-semana">
      <button class="botao-voltar" onclick="voltarParaSelecao()">&larr; Trocar líder</button>
      <button class="link-indicadores" onclick="abrirIndicadores()">📊 Meus indicadores</button>
    </div>
    <h1 id="nome-lider-semana"></h1>
    <p class="subtitulo">Expediente: 07:30 às 17:18</p>
    <div id="lista-semana">Carregando agenda...</div>
  </div>

  <!-- TELA 3: CHECKLIST DE FOCO (5S / Qualidade / Segurança) -->
  <div id="tela-foco" class="conteudo-estreito">
    <button class="botao-voltar" onclick="voltarParaSemana()">&larr; Voltar para a semana</button>
    <h1 id="titulo-foco"></h1>
    <div id="lista-foco">Carregando checklist...</div>
  </div>

  <!-- TELA 4: INDICADORES -->
  <div id="tela-indicadores" class="conteudo-estreito">
    <button class="botao-voltar" onclick="voltarIndicadoresParaSemana()">&larr; Voltar para a agenda</button>
    <h1 id="nome-lider-indicadores"></h1>
    <p class="subtitulo">Histórico completo</p>
    <div id="conteudo-indicadores">Carregando indicadores...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rcliveeoksfafxytckii.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LjQkaNYOQE2kxBxaTs88dg_rZpOdEI_";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let liderAtual = null;
    let focoAtual = null; // { tipo, label, data }

    const ORDEM_DIAS = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
    const NOMES_DIAS = {
      segunda: 'Segunda-feira',
      terca: 'Terça-feira',
      quarta: 'Quarta-feira',
      quinta: 'Quinta-feira',
      sexta: 'Sexta-feira'
    };
    const FOCOS_POR_DIA = {
      segunda: { tipo: '5s', label: '🧹 5S - Auto avaliação' },
      quarta: { tipo: 'qualidade', label: '🔍 Qualidade - Auto avaliação' },
      sexta: { tipo: 'seguranca', label: '🦺 Segurança - Auto avaliação' }
    };
    const NOMES_FOCO = { '5s': '5S', 'qualidade': 'Qualidade', 'seguranca': 'Segurança' };
    const ROTULOS_NOTA = { 1: 'Ruim', 2: 'Regular', 3: 'Bom', 4: 'Ótimo', 5: 'Excelente' };

    function formatarISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function hojeISO() {
      return formatarISO(new Date());
    }

    function diaSemanaAtual() {
      const dias = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
      return dias[new Date().getDay()];
    }

    function obterDatasDaSemana() {
      const hoje = new Date();
      const diaSemanaNum = hoje.getDay();
      const offsetSegunda = diaSemanaNum === 0 ? -6 : 1 - diaSemanaNum;
      const segunda = new Date(hoje);
      segunda.setDate(hoje.getDate() + offsetSegunda);

      const resultado = {};
      ORDEM_DIAS.forEach((dia, index) => {
        const d = new Date(segunda);
        d.setDate(segunda.getDate() + index);
        resultado[dia] = formatarISO(d);
      });
      return resultado;
    }

    function gerarDiasUteis(dataInicioStr, dataFimStr) {
      const nomes = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
      const inicio = new Date(dataInicioStr + 'T00:00:00');
      const fim = new Date(dataFimStr + 'T00:00:00');
      const resultado = [];
      let atual = new Date(inicio);
      while (atual <= fim) {
        const diaSemanaNum = atual.getDay();
        if (diaSemanaNum >= 1 && diaSemanaNum <= 5) {
          resultado.push({ data: formatarISO(atual), diaSemana: nomes[diaSemanaNum] });
        }
        atual.setDate(atual.getDate() + 1);
      }
      return resultado;
    }

    async function carregarLideres() {
      const { data, error } = await supabaseClient.from('lideres').select('*').order('nome');

      const lista = document.getElementById('lista-lideres');
      lista.innerHTML = '';

      if (error) {
        lista.innerHTML = 'Erro ao carregar: ' + error.message;
        return;
      }

      data.forEach(lider => {
        const botao = document.createElement('button');
        botao.className = 'botao-lider';
        botao.textContent = lider.nome;
        botao.onclick = () => selecionarLider(lider);
        lista.appendChild(botao);
      });
    }

    function selecionarLider(lider) {
      liderAtual = lider;
      document.getElementById('tela-selecao').style.display = 'none';
      document.getElementById('tela-semana').style.display = 'block';
      document.getElementById('nome-lider-semana').textContent = 'Agenda de ' + lider.nome;
      carregarSemana();
    }

    function voltarParaSelecao() {
      liderAtual = null;
      document.getElementById('tela-semana').style.display = 'none';
      document.getElementById('tela-selecao').style.display = 'block';
    }

    function voltarParaSemana() {
      focoAtual = null;
      document.getElementById('tela-foco').style.display = 'none';
      document.getElementById('tela-semana').style.display = 'block';
      carregarSemana();
    }

    async function carregarSemana() {
      const container = document.getElementById('lista-semana');
      container.innerHTML = 'Carregando agenda...';

      const datas = obterDatasDaSemana();
      const todasAsDatas = Object.values(datas);

      const { data: todosOsItens, error: erroItens } = await supabaseClient
        .from('itens_agenda')
        .select('*')
        .or('lider_id.eq.' + liderAtual.id + ',lider_id.is.null');

      if (erroItens) {
        container.innerHTML = 'Erro ao carregar itens: ' + erroItens.message;
        return;
      }

      const { data: execucoesSemana, error: erroExec } = await supabaseClient
        .from('execucoes')
        .select('*')
        .eq('lider_id', liderAtual.id)
        .in('data', todasAsDatas);

      if (erroExec) {
        container.innerHTML = 'Erro ao carregar execuções: ' + erroExec.message;
        return;
      }

      container.innerHTML = '';
      const diaHoje = diaSemanaAtual();

      ORDEM_DIAS.forEach(dia => {
        const dataDoDia = datas[dia];
        const estaDisponivel = (dia === diaHoje);

        const itensNormais = todosOsItens
          .filter(item =>
            (item.dia_semana === 'todos' || item.dia_semana === dia) &&
            (!item.categoria || item.categoria === '')
          )
          .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

        const card = document.createElement('div');
        card.className = 'card-dia' + (estaDisponivel ? ' dia-hoje' : ' dia-bloqueado');

        const faixa = document.createElement('div');
        faixa.className = 'faixa-madeira';
        card.appendChild(faixa);

        const conteudoCard = document.createElement('div');
        conteudoCard.className = 'conteudo-card';

        const titulo = document.createElement('h3');
        titulo.textContent = NOMES_DIAS[dia];
        conteudoCard.appendChild(titulo);

        if (itensNormais.length > 0) {
          const ul = document.createElement('ul');
          ul.className = 'lista-rotina';
          itensNormais.forEach(item => {
            const li = document.createElement('li');

            const spanTitulo = document.createElement('span');
            spanTitulo.className = 'titulo-item-rotina';
            spanTitulo.textContent = item.titulo;
            li.appendChild(spanTitulo);

            if (item.descricao) {
              const caixaObs = document.createElement('div');
              caixaObs.className = 'caixa-observacao';
              caixaObs.style.display = 'none';
              caixaObs.textContent = item.descricao;
              li.appendChild(caixaObs);

              spanTitulo.onclick = () => {
                caixaObs.style.display = (caixaObs.style.display === 'none') ? 'block' : 'none';
              };
            }

            ul.appendChild(li);
          });
          conteudoCard.appendChild(ul);

          const execRotina = execucoesSemana.find(e => e.item_id === null && e.data === dataDoDia && e.contexto !== 'obs_geral_foco');
          const rotinaConcluida = execRotina ? execRotina.concluido : false;

          const linhaCheck = document.createElement('div');
          linhaCheck.className = 'linha-rotina-check';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = rotinaConcluida;
          checkbox.disabled = !estaDisponivel;
          checkbox.onchange = () => marcarRotinaDia(dataDoDia, execRotina, checkbox.checked);

          const label = document.createElement('span');
          label.textContent = 'Rotina do dia cumprida';

          linhaCheck.appendChild(checkbox);
          linhaCheck.appendChild(label);
          conteudoCard.appendChild(linhaCheck);

          if (!estaDisponivel) {
            const nota = document.createElement('p');
            nota.className = 'nota-bloqueado';
            nota.textContent = 'Disponível somente no dia correspondente.';
            conteudoCard.appendChild(nota);
          }
        } else {
          const p = document.createElement('p');
          p.className = 'lista-rotina';
          p.textContent = 'Nenhum item de rotina cadastrado.';
          conteudoCard.appendChild(p);
        }

        const foco = FOCOS_POR_DIA[dia];
        if (foco) {
          const itensFoco = todosOsItens.filter(item => item.categoria === foco.tipo);
          const execucoesFoco = execucoesSemana.filter(e =>
            e.data === dataDoDia && itensFoco.some(i => i.id === e.item_id)
          );
          const focoConcluido = itensFoco.length > 0 &&
            itensFoco.every(item => execucoesFoco.some(e => e.item_id === item.id && e.nota));

          const botaoFoco = document.createElement('button');
          botaoFoco.className = 'linha-foco';
          botaoFoco.disabled = !estaDisponivel;
          botaoFoco.innerHTML = '<span>' + foco.label + '</span>' +
            '<span class="status-foco">' + (focoConcluido ? '✔️ Concluído' : 'Pendente') + '</span>';
          if (estaDisponivel) {
            botaoFoco.onclick = () => abrirFoco(foco.tipo, foco.label, dataDoDia);
          }
          conteudoCard.appendChild(botaoFoco);
        }

        card.appendChild(conteudoCard);
        container.appendChild(card);
      });
    }

    async function marcarRotinaDia(data, execExistente, concluido) {
      const agora = new Date().toISOString();

      if (execExistente) {
        const { error } = await supabaseClient
          .from('execucoes')
          .update({ concluido: concluido, hora_conclusao: concluido ? agora : null })
          .eq('id', execExistente.id);

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      } else {
        const { error } = await supabaseClient
          .from('execucoes')
          .insert({
            item_id: null,
            lider_id: liderAtual.id,
            data: data,
            concluido: concluido,
            hora_conclusao: concluido ? agora : null,
            contexto: 'rotina_dia'
          });

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      }

      carregarSemana();
    }

    function abrirFoco(tipo, label, data) {
      focoAtual = { tipo: tipo, label: label, data: data };
      document.getElementById('tela-semana').style.display = 'none';
      document.getElementById('tela-foco').style.display = 'block';
      document.getElementById('titulo-foco').textContent = label;
      carregarFoco();
    }

    async function carregarFoco() {
      const container = document.getElementById('lista-foco');
      container.innerHTML = 'Carregando checklist...';

      const { data: itens, error: erroItens } = await supabaseClient
        .from('itens_agenda')
        .select('*')
        .eq('categoria', focoAtual.tipo)
        .order('ordem', { ascending: true });

      if (erroItens) {
        container.innerHTML = 'Erro ao carregar itens: ' + erroItens.message;
        return;
      }

      const { data: execucoesFoco, error: erroExec } = await supabaseClient
        .from('execucoes')
        .select('*')
        .eq('lider_id', liderAtual.id)
        .eq('data', focoAtual.data);

      if (erroExec) {
        container.innerHTML = 'Erro ao carregar execuções: ' + erroExec.message;
        return;
      }

      container.innerHTML = '';

      if (itens.length === 0) {
        container.innerHTML = 'Nenhum item cadastrado para este checklist ainda.';
        return;
      }

      const itensRenderizados = [];

      itens.forEach(item => {
        const execExistente = execucoesFoco.find(e => e.item_id === item.id);
        const notaExistente = execExistente ? execExistente.nota : null;
        const planoExistente = execExistente && execExistente.observacao ? execExistente.observacao : '';

        const div = document.createElement('div');
        div.className = 'item-checklist';

        const textos = document.createElement('div');
        textos.className = 'textos';

        const spanTitulo = document.createElement('span');
        spanTitulo.className = 'titulo';
        spanTitulo.textContent = item.titulo;
        textos.appendChild(spanTitulo);

        if (item.descricao) {
          const spanDescricao = document.createElement('span');
          spanDescricao.className = 'descricao';
          spanDescricao.textContent = item.descricao;
          textos.appendChild(spanDescricao);
        }

        const notasContainer = document.createElement('div');
        notasContainer.className = 'notas-container';

        const avisoObrigatorio = document.createElement('p');
        avisoObrigatorio.className = 'aviso-obrigatorio';
        avisoObrigatorio.textContent = 'Nota 3 ou menor exige plano de ação preenchido.';

        const labelPlano = document.createElement('p');
        labelPlano.className = 'plano-acao-label';
        labelPlano.textContent = 'Plano de ação:';

        const textareaPlano = document.createElement('textarea');
        textareaPlano.className = 'plano-acao';
        textareaPlano.rows = 2;
        textareaPlano.placeholder = 'Descreva a ação corretiva, se necessário...';
        textareaPlano.value = planoExistente;

        function notaAtualSelecionada() {
          const botaoSelecionado = notasContainer.querySelector('.botao-nota.selecionada');
          return botaoSelecionado ? parseInt(botaoSelecionado.querySelector('.numero').textContent) : null;
        }

        function atualizarAviso() {
          const n = notaAtualSelecionada();
          const precisaPlano = n !== null && n <= 3;
          const planoPreenchido = textareaPlano.value.trim() !== '';
          avisoObrigatorio.classList.toggle('visivel', precisaPlano && !planoPreenchido);
        }

        [1, 2, 3, 4, 5].forEach(n => {
          const botaoNota = document.createElement('button');
          botaoNota.type = 'button';
          botaoNota.className = 'botao-nota' + (notaExistente === n ? ' selecionada' : '');
          botaoNota.innerHTML = '<span class="numero">' + n + '</span><span class="rotulo">' + ROTULOS_NOTA[n] + '</span>';
          botaoNota.onclick = () => {
            notasContainer.querySelectorAll('.botao-nota').forEach(b => b.classList.remove('selecionada'));
            botaoNota.classList.add('selecionada');
            atualizarAviso();
            salvarItemFoco(item, execExistente, n, textareaPlano.value.trim());
          };
          notasContainer.appendChild(botaoNota);
        });

        textareaPlano.onblur = () => {
          atualizarAviso();
          const n = notaAtualSelecionada();
          if (n !== null) {
            salvarItemFoco(item, execExistente, n, textareaPlano.value.trim());
          }
        };

        textos.appendChild(notasContainer);
        textos.appendChild(avisoObrigatorio);
        textos.appendChild(labelPlano);
        textos.appendChild(textareaPlano);

        atualizarAviso();

        div.appendChild(textos);
        container.appendChild(div);

        itensRenderizados.push({ item: item, notasContainer: notasContainer, textareaPlano: textareaPlano });
      });

      const execGeral = execucoesFoco.find(e => e.item_id === null && e.contexto === 'obs_geral_foco');

      const boxGeral = document.createElement('div');
      boxGeral.className = 'observacoes-gerais';

      const tituloGeral = document.createElement('h4');
      tituloGeral.textContent = 'Observações gerais do checklist';
      boxGeral.appendChild(tituloGeral);

      const textareaGeral = document.createElement('textarea');
      textareaGeral.className = 'plano-acao';
      textareaGeral.rows = 3;
      textareaGeral.placeholder = 'Alguma observação sobre o checklist de hoje...';
      textareaGeral.value = execGeral && execGeral.observacao ? execGeral.observacao : '';
      textareaGeral.onblur = () => salvarObservacaoGeral(execGeral, textareaGeral.value.trim());
      boxGeral.appendChild(textareaGeral);

      container.appendChild(boxGeral);

      const botaoSalvar = document.createElement('button');
      botaoSalvar.className = 'botao-salvar-foco';
      botaoSalvar.textContent = 'Salvar e voltar';
      botaoSalvar.onclick = () => validarSalvarFoco(itensRenderizados);
      container.appendChild(botaoSalvar);
    }

    function validarSalvarFoco(itensRenderizados) {
      const pendencias = [];

      itensRenderizados.forEach(ref => {
        const botaoSelecionado = ref.notasContainer.querySelector('.botao-nota.selecionada');
        const nota = botaoSelecionado ? parseInt(botaoSelecionado.querySelector('.numero').textContent) : null;
        const plano = ref.textareaPlano.value.trim();
        const palavras = plano.split(/\s+/).filter(Boolean);

        if (nota !== null && nota <= 3 && palavras.length < 2) {
          pendencias.push(ref.item.titulo);
        }
      });

      if (pendencias.length > 0) {
        alert('Antes de salvar, preencha o plano de ação (mínimo 2 palavras) para: ' + pendencias.join(', '));
        return;
      }

      voltarParaSemana();
    }

    async function salvarItemFoco(item, execExistente, nota, planoAcao) {
      const agora = new Date().toISOString();
      const observacaoFinal = planoAcao === '' ? null : planoAcao;

      if (execExistente) {
        const { error } = await supabaseClient
          .from('execucoes')
          .update({
            nota: nota,
            concluido: true,
            hora_conclusao: agora,
            observacao: observacaoFinal
          })
          .eq('id', execExistente.id);

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      } else {
        const { error } = await supabaseClient
          .from('execucoes')
          .insert({
            item_id: item.id,
            lider_id: liderAtual.id,
            data: focoAtual.data,
            nota: nota,
            concluido: true,
            hora_conclusao: agora,
            observacao: observacaoFinal
          });

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      }

      carregarFoco();
    }

    async function salvarObservacaoGeral(execExistente, texto) {
      const observacaoFinal = texto === '' ? null : texto;

      if (execExistente) {
        const { error } = await supabaseClient
          .from('execucoes')
          .update({ observacao: observacaoFinal })
          .eq('id', execExistente.id);

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      } else {
        if (observacaoFinal === null) return;

        const { error } = await supabaseClient
          .from('execucoes')
          .insert({
            item_id: null,
            lider_id: liderAtual.id,
            data: focoAtual.data,
            observacao: observacaoFinal,
            contexto: 'obs_geral_foco'
          });

        if (error) {
          alert('Erro ao salvar: ' + error.message);
          return;
        }
      }

      carregarFoco();
    }

    function abrirIndicadores() {
      document.getElementById('tela-semana').style.display = 'none';
      document.getElementById('tela-indicadores').style.display = 'block';
      document.getElementById('nome-lider-indicadores').textContent = 'Indicadores de ' + liderAtual.nome;
      carregarIndicadores();
    }

    function voltarIndicadoresParaSemana() {
      document.getElementById('tela-indicadores').style.display = 'none';
      document.getElementById('tela-semana').style.display = 'block';
      carregarSemana();
    }

    async function carregarIndicadores() {
      const container = document.getElementById('conteudo-indicadores');
      container.innerHTML = 'Carregando indicadores...';

      const { data: todasExecucoesDoLider, error: erroExec } = await supabaseClient
        .from('execucoes')
        .select('*')
        .eq('lider_id', liderAtual.id);

      if (erroExec) {
        container.innerHTML = 'Erro ao carregar dados: ' + erroExec.message;
        return;
      }

      const { data: itensRelevantes, error: erroItens } = await supabaseClient
        .from('itens_agenda')
        .select('*')
        .or('lider_id.eq.' + liderAtual.id + ',lider_id.is.null');

      if (erroItens) {
        container.innerHTML = 'Erro ao carregar itens: ' + erroItens.message;
        return;
      }

      const { data: primeiraExec, error: erroPrimeira } = await supabaseClient
        .from('execucoes')
        .select('data')
        .order('data', { ascending: true })
        .limit(1);

      if (erroPrimeira) {
        container.innerHTML = 'Erro ao carregar histórico: ' + erroPrimeira.message;
        return;
      }

      const dataInicio = (primeiraExec && primeiraExec.length > 0) ? primeiraExec[0].data : hojeISO();
      const diasUteis = gerarDiasUteis(dataInicio, hojeISO());

      // Indicador de aderência à rotina
      const diasComRotina = diasUteis.filter(d =>
        todasExecucoesDoLider.some(e => e.item_id === null && e.contexto === 'rotina_dia' && e.data === d.data && e.concluido)
      ).length;
      const percRotina = diasUteis.length > 0 ? Math.round((diasComRotina / diasUteis.length) * 100) : 0;

      // Indicador de aderência às atividades foco
      const diasComFoco = diasUteis.filter(d => FOCOS_POR_DIA[d.diaSemana]);
      let focoCumpridosTotal = 0;
      const focoPorTipo = { '5s': { total: 0, cumpridos: 0 }, 'qualidade': { total: 0, cumpridos: 0 }, 'seguranca': { total: 0, cumpridos: 0 } };

      diasComFoco.forEach(d => {
        const tipo = FOCOS_POR_DIA[d.diaSemana].tipo;
        const itensDoTipo = itensRelevantes.filter(i => i.categoria === tipo);
        const cumpriu = itensDoTipo.length > 0 &&
          itensDoTipo.every(item => todasExecucoesDoLider.some(e => e.item_id === item.id && e.data === d.data && e.nota));

        focoPorTipo[tipo].total++;
        if (cumpriu) {
          focoPorTipo[tipo].cumpridos++;
          focoCumpridosTotal++;
        }
      });

      const percFocoGeral = diasComFoco.length > 0 ? Math.round((focoCumpridosTotal / diasComFoco.length) * 100) : 0;

      container.innerHTML = '';

      // Cartões de resumo
      const cartoes = document.createElement('div');
      cartoes.className = 'cartoes-resumo';

      const cartaoRotina = document.createElement('div');
      cartaoRotina.className = 'cartao-resumo';
      cartaoRotina.innerHTML = '<div class="numero-grande">' + percRotina + '%</div><div class="rotulo-cartao">Aderência à Rotina</div>';
      cartoes.appendChild(cartaoRotina);

      const cartaoFoco = document.createElement('div');
      cartaoFoco.className = 'cartao-resumo';
      let badgesHtml = '<div class="badges-foco">';
      ['5s', 'qualidade', 'seguranca'].forEach(tipo => {
        const t = focoPorTipo[tipo];
        const pct = t.total > 0 ? Math.round((t.cumpridos / t.total) * 100) : 0;
        badgesHtml += '<span class="badge-foco">' + NOMES_FOCO[tipo] + ': ' + pct + '%</span>';
      });
      badgesHtml += '</div>';
      cartaoFoco.innerHTML = '<div class="numero-grande">' + percFocoGeral + '%</div><div class="rotulo-cartao">Aderência às Atividades Foco</div>' + badgesHtml;
      cartoes.appendChild(cartaoFoco);

      container.appendChild(cartoes);

      // Acompanhamento de notas por atividade foco
      ['5s', 'qualidade', 'seguranca'].forEach(tipo => {
        const itensDoTipo = itensRelevantes
          .filter(i => i.categoria === tipo)
          .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

        if (itensDoTipo.length === 0) return;

        const secao = document.createElement('div');
        secao.className = 'secao-acompanhamento';

        const tituloSecao = document.createElement('h3');
        tituloSecao.textContent = 'Notas de autoavaliação — ' + NOMES_FOCO[tipo];
        secao.appendChild(tituloSecao);

        itensDoTipo.forEach(item => {
          const notas = todasExecucoesDoLider
            .filter(e => e.item_id === item.id && e.nota)
            .map(e => e.nota);

          const media = notas.length > 0 ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1) : '—';

          const linha = document.createElement('div');
          linha.className = 'linha-item-acompanhado';
          linha.innerHTML = '<span>' + item.titulo + ' <span style="color: var(--texto-secundario); font-size: 11px;">(' + notas.length + ' avaliações)</span></span>' +
            '<span class="media-nota">' + media + '</span>';
          secao.appendChild(linha);
        });

        container.appendChild(secao);
      });
    }

    carregarLideres();
  </script>
</body>
</html>
